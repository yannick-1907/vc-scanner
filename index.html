<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VC Scanner – Praktika & Einstieg bei VCs in Deutschland</title>
<style>
  :root {
    --bg: #0b0c10;
    --surface: #14161d;
    --surface-2: #1b1e27;
    --border: #262a36;
    --text: #e8eaf0;
    --muted: #9aa2b1;
    --accent: #6c8cff;
    --accent-soft: rgba(108, 140, 255, 0.14);
    --new: #35d07f;
    --new-soft: rgba(53, 208, 127, 0.15);
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-2: #f0f2f8;
      --border: #e2e5ee;
      --text: #16181f;
      --muted: #667085;
      --accent: #3a5bff;
      --accent-soft: rgba(58, 91, 255, 0.1);
      --new: #12a05c;
      --new-soft: rgba(18, 160, 92, 0.12);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }
  header h1 { font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  header p { color: var(--muted); margin: 0 0 4px; font-size: 0.95rem; }
  .meta { color: var(--muted); font-size: 0.8rem; margin-top: 6px; }

  .controls {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin: 24px 0 18px; position: sticky; top: 0;
    background: var(--bg); padding: 12px 0; z-index: 5;
  }
  input[type="search"], select {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 0.92rem; outline: none;
  }
  input[type="search"] { flex: 1 1 240px; }
  input[type="search"]:focus, select:focus { border-color: var(--accent); }

  .stats { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }

  .job {
    display: block; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px;
    transition: border-color .15s, transform .05s;
  }
  .job:hover { border-color: var(--accent); }
  .job:active { transform: scale(0.997); }
  .job-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .job-title { font-weight: 600; font-size: 1.02rem; margin: 0; }
  .badge {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 3px 8px; border-radius: 999px;
    background: var(--new-soft); color: var(--new);
  }
  .job-sub { color: var(--muted); font-size: 0.88rem; margin-top: 6px;
    display: flex; gap: 14px; flex-wrap: wrap; }
  .job-sub .vc { color: var(--text); font-weight: 600; }
  .job-sub .dot::before { content: "•"; margin-right: 6px; color: var(--border); }

  /* Mehrfachauswahl-Dropdown für VCs */
  .ms { position: relative; }
  .ms-btn {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 0.92rem; font-family: inherit;
    min-width: 190px; justify-content: space-between;
  }
  .ms-btn:hover, .ms-btn[aria-expanded="true"] { border-color: var(--accent); }
  .ms-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ms-btn .chev { color: var(--muted); font-size: 0.7rem; }
  .ms-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 10;
    width: max(100%, 280px); max-height: 380px; overflow: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,.28);
  }
  .ms-panel[hidden] { display: none; }
  .ms-actions { display: flex; gap: 8px; padding: 4px 6px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .ms-actions button {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font: inherit; font-size: 0.82rem; padding: 2px 4px;
  }
  .ms-opt {
    display: flex; align-items: center; gap: 10px; padding: 7px 8px;
    border-radius: 8px; cursor: pointer; font-size: 0.9rem;
  }
  .ms-opt:hover { background: var(--surface-2); }
  .ms-opt input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .ms-opt .name { flex: 1; }
  .ms-opt .count {
    font-size: 0.75rem; color: var(--muted); background: var(--surface-2);
    border-radius: 999px; padding: 1px 8px; min-width: 24px; text-align: center;
  }
  .ms-opt .count.has { color: var(--new); background: var(--new-soft); font-weight: 600; }
  .ms-opt.none .name { color: var(--muted); }
  .ms-opt .count.na { background: transparent; border: 1px dashed var(--border); font-size: 0.7rem; }

  .notice {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 14px;
    color: var(--muted); font-size: 0.88rem;
  }
  .notice strong { color: var(--text); }
  .vc-empty {
    background: var(--surface); border: 1px dashed var(--border);
    border-radius: var(--radius); padding: 28px 18px; margin-bottom: 12px;
    text-align: center;
  }
  .vc-empty .name { font-weight: 600; font-size: 1.05rem; }
  .vc-empty .msg { color: var(--muted); margin-top: 4px; }
  .vc-empty a { display: inline-block; margin-top: 10px; font-size: 0.88rem; }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.8rem; text-align: center; }
  a.link { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎯 VC Scanner</h1>
      <p>Praktika &amp; Einstiegsstellen bei Venture-Capital-Fonds in Deutschland.</p>
      <p class="meta" id="updated">Lade…</p>
    </header>

    <div class="controls">
      <input type="search" id="search" placeholder="Suche nach Titel, VC, Ort…" />
      <div class="ms" id="vcMs">
        <button type="button" class="ms-btn" id="vcBtn" aria-haspopup="true" aria-expanded="false" aria-controls="vcPanel">
          <span id="vcLabel">Alle VCs</span><span class="chev" aria-hidden="true">▼</span>
        </button>
        <div class="ms-panel" id="vcPanel" role="group" aria-label="VCs auswählen" hidden></div>
      </div>
      <select id="typeFilter">
        <option value="">Alle Typen</option>
        <option value="praktik">Praktikum</option>
        <option value="werkstudent">Werkstudent</option>
        <option value="intern">Internship</option>
        <option value="analyst">Analyst</option>
        <option value="associate">Associate</option>
        <option value="graduate">Graduate/Junior</option>
      </select>
    </div>

    <div class="stats" id="stats"></div>
    <div id="list"></div>

    <footer>
      Automatisch aktualisiert via GitHub Actions · Quelle: Karriereseiten der jeweiligen VCs.
    </footer>
  </div>

<script>
const state = { jobs: [], vcs: [], selected: new Set() };

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("de-DE", { day: "2-digit", month: "short", year: "numeric" });
}
function isNew(iso) {
  if (!iso) return false;
  return (Date.now() - new Date(iso).getTime()) < 3 * 24 * 3600 * 1000; // < 3 Tage
}

async function load() {
  try {
    const res = await fetch("./data/jobs.json?_=" + Date.now());
    const data = await res.json();
    state.jobs = data.jobs || [];
    // Alle gescannten VCs (auch ohne Stelle). Fallback für ältere Daten ohne "vcs":
    // nur die VCs, die aktuell Stellen haben.
    const known = new Map((data.vcs || []).map(v => [v.name, v]));
    for (const j of state.jobs) {
      if (!known.has(j.vc)) known.set(j.vc, { name: j.vc, website: j.vc_website || "", scannable: true });
    }
    state.vcs = [...known.values()].sort((a, b) => a.name.localeCompare(b.name, "de"));
    document.getElementById("updated").textContent =
      "Zuletzt aktualisiert: " + (data.updated_at ? fmtDate(data.updated_at) : "—") +
      " · " + (data.count ?? state.jobs.length) + " offene Stellen · " +
      state.vcs.filter(v => v.scannable !== false).length + " von " + state.vcs.length + " VCs automatisch überwacht";
    buildVcOptions();
    render();
  } catch (e) {
    document.getElementById("list").innerHTML =
      '<div class="empty">Konnte Daten nicht laden. Läuft der Scanner schon?</div>';
  }
}

function jobCounts() {
  const counts = {};
  for (const j of state.jobs) counts[j.vc] = (counts[j.vc] || 0) + 1;
  return counts;
}

function buildVcOptions() {
  const panel = document.getElementById("vcPanel");
  const counts = jobCounts();
  panel.innerHTML =
    '<div class="ms-actions">' +
      '<button type="button" data-act="all">Alle auswählen</button>' +
      '<button type="button" data-act="none">Zurücksetzen</button>' +
    '</div>' +
    state.vcs.map((v, i) => {
      const n = counts[v.name] || 0;
      const na = v.scannable === false;
      return `<label class="ms-opt ${n ? "" : "none"}">
        <input type="checkbox" value="${escapeHtml(v.name)}" ${state.selected.has(v.name) ? "checked" : ""} />
        <span class="name">${escapeHtml(v.name)}</span>
        ${na
          ? '<span class="count na" title="Nicht automatisch scanbar – Karriereseite manuell prüfen">–</span>'
          : `<span class="count ${n ? "has" : ""}" title="${n} offene Stelle(n)">${n}</span>`}
      </label>`;
    }).join("");
  updateVcLabel();
}

function updateVcLabel() {
  const n = state.selected.size;
  document.getElementById("vcLabel").textContent =
    n === 0 ? "Alle VCs" : n === 1 ? [...state.selected][0] : n + " VCs ausgewählt";
}

function setPanel(open) {
  document.getElementById("vcPanel").hidden = !open;
  document.getElementById("vcBtn").setAttribute("aria-expanded", String(open));
}

function emptyMessage(names) {
  const by = Object.fromEntries(state.vcs.map(v => [v.name, v]));
  return names.map(n => {
    const v = by[n] || {};
    const msg = v.scannable === false
      ? "Nicht automatisch scanbar – Karriereseite manuell prüfen."
      : "Aktuell keine Stelle ausgeschrieben.";
    return `
    <div class="vc-empty">
      <div class="name">${escapeHtml(n)}</div>
      <div class="msg">${msg}</div>
      ${v.website ? `<a class="link" href="${escapeHtml(v.website)}" target="_blank" rel="noopener">Zur Karriereseite ↗</a>` : ""}
    </div>`;
  }).join("");
}

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const type = document.getElementById("typeFilter").value.toLowerCase();
  const sel = state.selected;

  let jobs = state.jobs.filter(j => {
    const hay = (j.title + " " + j.vc + " " + (j.location||"") + " " + (j.department||"")).toLowerCase();
    if (q && !hay.includes(q)) return false;
    if (sel.size && !sel.has(j.vc)) return false;
    if (type && !j.title.toLowerCase().includes(type)) return false;
    return true;
  });

  const list = document.getElementById("list");
  document.getElementById("stats").textContent =
    jobs.length + " Stelle" + (jobs.length === 1 ? "" : "n") + " angezeigt";

  // Ausgewählte VCs, die überhaupt keine offene Stelle haben (unabhängig von Suche/Typ).
  const counts = jobCounts();
  const emptyVcs = [...sel].filter(n => !counts[n]).sort((a, b) => a.localeCompare(b, "de"));
  const scannable = Object.fromEntries(state.vcs.map(v => [v.name, v.scannable !== false]));
  const noneOpen = emptyVcs.filter(n => scannable[n]);       // Feed vorhanden, aber keine Stelle
  const notScanned = emptyVcs.filter(n => !scannable[n]);    // kein auslesbarer Feed

  if (!jobs.length) {
    if (emptyVcs.length && emptyVcs.length === sel.size) {
      list.innerHTML = emptyMessage(emptyVcs);            // nur VCs ohne Stelle gewählt
    } else if (emptyVcs.length) {
      list.innerHTML = emptyMessage(emptyVcs) +
        '<div class="empty">Keine passenden Stellen für die übrigen Filter. 🔍</div>';
    } else {
      list.innerHTML = '<div class="empty">Keine passenden Stellen. 🔍</div>';
    }
    return;
  }

  const notice =
    (noneOpen.length
      ? `<div class="notice">Aktuell keine Stelle ausgeschrieben bei: <strong>${noneOpen.map(escapeHtml).join(", ")}</strong></div>`
      : "") +
    (notScanned.length
      ? `<div class="notice">Nicht automatisch scanbar (Karriereseite manuell prüfen): <strong>${notScanned.map(escapeHtml).join(", ")}</strong></div>`
      : "");

  list.innerHTML = notice + jobs.map(j => `
    <a class="job" href="${j.url}" target="_blank" rel="noopener">
      <div class="job-top">
        <p class="job-title">${escapeHtml(j.title)}</p>
        ${isNew(j.first_seen) ? '<span class="badge">Neu</span>' : ''}
      </div>
      <div class="job-sub">
        <span class="vc">${escapeHtml(j.vc)}</span>
        ${j.location ? `<span class="dot">${escapeHtml(j.location)}</span>` : ''}
        ${j.department ? `<span class="dot">${escapeHtml(j.department)}</span>` : ''}
        ${j.first_seen ? `<span class="dot">seit ${fmtDate(j.first_seen)}</span>` : ''}
      </div>
    </a>`).join("");
}

function escapeHtml(s) {
  return (s||"").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

["search","typeFilter"].forEach(id =>
  document.getElementById(id).addEventListener("input", render));

// Mehrfachauswahl-Dropdown
document.getElementById("vcBtn").addEventListener("click", () =>
  setPanel(document.getElementById("vcPanel").hidden));
document.getElementById("vcPanel").addEventListener("change", e => {
  if (e.target.type !== "checkbox") return;
  e.target.checked ? state.selected.add(e.target.value) : state.selected.delete(e.target.value);
  updateVcLabel();
  render();
});
document.getElementById("vcPanel").addEventListener("click", e => {
  const act = e.target.dataset && e.target.dataset.act;
  if (!act) return;
  state.selected = act === "all" ? new Set(state.vcs.map(v => v.name)) : new Set();
  buildVcOptions();
  render();
});
document.addEventListener("click", e => {
  if (!document.getElementById("vcMs").contains(e.target)) setPanel(false);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { setPanel(false); document.getElementById("vcBtn").focus(); }
});

load();
</script>
</body>
</html>
